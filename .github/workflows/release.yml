name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write        # needed to push changelog and tags
  issues: write          # needed for GitHub releases
  pull-requests: write   # needed for GitHub release notes
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for semantic-release to analyze full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Debug NPM_TOKEN
        run: echo "NPM_TOKEN is set to [${NPM_TOKEN}]"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Note: The actual token value will be masked for security

      - name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          SEMANTIC_RELEASE_LOG_LEVEL: debug  # Enable debug logging
        run: npx semantic-release